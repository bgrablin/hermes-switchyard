name: hermes-switchyard
version: 0.4.2
author: bgrablin
manifest_version: 1
description: Jev-powered skill and model routing with fast, safety-gated native computer use, full-catalog selection, typed decisions, and auditable receipts.
license: MIT
homepage: https://github.com/bgrablin/hermes-switchyard
tags: [jev, computer-use, routing, skills]
requires_env: []
optional_env:
  - name: OPENROUTER_API_KEY
    description: OpenRouter inference key for the Decisions endpoint; optional when TYPESAFE_API_KEY is configured
    url: https://openrouter.ai/keys
    secret: true
  - name: TYPESAFE_API_KEY
    description: Direct TypeSafe API key; preferred for the lowest-latency Jev route
    url: https://console.typesafe.ai/keys
    secret: true
provides_tools:
  - jev_assess
  - jev_computer_use
  - jev_skill_select
  - jev_skill_select_many
  - jev_model_route
provides_hooks:
  - pre_llm_call
config_schema:
  jev_provider: {type: str, default: "auto", description: auto prefers direct TypeSafe when TYPESAFE_API_KEY is available; also accepts typesafe or openrouter}
  api_endpoint: {type: str, default: "https://openrouter.ai/api/alpha/decisions", description: Fixed TypeSafe or OpenRouter Jev endpoint; arbitrary endpoints fail closed}
  jev_model: {type: str, default: "", description: Provider-specific Jev alias; empty selects jev-latest for TypeSafe or typesafe/jev-1.13 for OpenRouter}
  computer_max_steps: {type: int, default: 100, description: Full computer-use action budget; callers may choose a smaller per-call bound}
  automatic_skill_recommendation: {type: bool, default: true, description: Enable bounded local skill recommendations in the pre_llm_call lifecycle hook}
  automatic_skill_consumer_mode: {type: str, default: "advisory", description: "advisory injects a recommendation; load invokes Hermes skill_view once per accepted turn and preserves typed load readback"}
  automatic_skill_candidates: {type: list, default: [], description: "Explicit skill candidate objects; an empty list uses the full Hermes active profile skills registry and candidate descriptions remain local-only for automatic hosted routing"}
  automatic_skill_local_threshold: {type: float, default: 0.2, description: "Local token-overlap threshold; it is an uncalibrated abstention policy"}
  automatic_skill_local_margin: {type: float, default: 0.05, description: "Required local winner margin; it is an uncalibrated abstention policy"}
  automatic_skill_cache_seconds: {type: float, default: 30.0, description: "Bounded per-process recommendation cache lifetime"}
  automatic_skill_routing_mode: {type: str, default: "local_only", description: "Automatic routing mode: off, local_only, or hosted_sanitized; local_only is the safe install default; hosted_sanitized is an explicit opt-in and a host envelope is optional strengthening"}
  automatic_skill_jev: {type: bool, default: true, description: "Deprecated compatibility switch; retained for configuration compatibility and never authorizes hosted egress; set automatic_skill_routing_mode to hosted_sanitized for explicit opt-in"}
  automatic_skill_jev_mode: {type: str, default: "always", description: "always evaluates the full catalog on every allowed turn; uncertain_only is an explicit latency-saving override"}
  automatic_skill_public_or_sanitized_data_ack: {type: bool, default: true, description: "Standing consent for explicit hosted automatic Jev opt-in. The local_only default never constructs hosted routing. Set false to refuse hosted automatic routing. Not Hermes-owned DLP."}
  automatic_skill_mandatory_skills: {type: list, default: [], description: "Exact skill identifiers treated as mandatory; load mode does not auto-load a different recommendation"}
  public_or_sanitized_data_ack: {type: bool, default: true, description: "Standing consent for Jev tool calls. On after install. Callers may omit the field. Set false to refuse Jev calls."}
