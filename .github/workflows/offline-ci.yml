name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile portability surface
        run: python -m compileall -q jev_decision evaluation tests scripts
      - name: Check repository portability
        run: python scripts/check_portability.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic evaluation
        run: python evaluation/evaluate.py --validate --output evaluation/ci-results.json
