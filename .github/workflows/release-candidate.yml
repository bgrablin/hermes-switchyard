name: Release candidate

# Manual candidate build only. This workflow never creates tags or publishes releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check-upload:
    name: Build and verify candidate archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Confirm exact source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$(git rev-parse --verify "$source_sha^{commit}")" = "$source_sha"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Compile source and run offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q jev_decision evaluation tests scripts
          python scripts/check_portability.py
          python scripts/check_portability.py --history
          python -m unittest discover -s tests -v
          python evaluation/evaluate.py --validate --output "$RUNNER_TEMP/switchyard-synthetic-results.json"
      - name: Build and verify deterministic release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python scripts/build_release.py --source-sha "$GITHUB_SHA" --output-dir dist
          python - <<'PY'
          import os
          from pathlib import Path

          from scripts.build_release import verify_archive

          archives = sorted(Path("dist").glob("hermes-switchyard-*.zip"))
          assert len(archives) == 1, archives
          result = verify_archive(
              archives[0],
              source_root=Path("."),
              expected_source_sha=os.environ["GITHUB_SHA"],
          )
          assert result["plugin"] == "jev-decision"
          assert result["integrity_verified"] is True
          assert result["source_verified"] is True
          assert result["verification"] == "source-verified"
          print(f"source-verified candidate {archives[0].name} for {result['source_sha']}")
          PY
      - name: Upload candidate archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-switchyard-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 9
