name: Live Jev contract

on:
  workflow_dispatch:
    inputs:
      trusted_ref:
        description: Reviewed branch to exercise
        required: true
        type: choice
        options:
          - bgrablin/release-packaging
          - main
        default: bgrablin/release-packaging
      trusted_sha:
        description: Exact 40-character lowercase SHA on the selected reviewed branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-jev-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HERMES_UPSTREAM_SHA: 8503ee4459316ce092b5d69b7d396c27aa03d0be
  TRUSTED_REPOSITORY: bgrablin/hermes-switchyard

jobs:
  authorize-source:
    name: Authorize reviewed source selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      trusted_ref: ${{ steps.source.outputs.trusted_ref }}
      trusted_sha: ${{ steps.source.outputs.trusted_sha }}
    steps:
      - name: Validate manual selector against the immutable workflow allowlist
        id: selector
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.trusted_ref }}
          REQUESTED_SHA: ${{ inputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$TRUSTED_REPOSITORY"
          case "$REQUESTED_REF" in
            main|bgrablin/release-packaging) ;;
            *) echo '::error::ref is not in the explicit live-contract allowlist'; exit 1 ;;
          esac
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source SHA must be exact lowercase hexadecimal'
            exit 1
          fi

      - name: Check out main when main was explicitly selected
        if: inputs.trusted_ref == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the stacked base when it was explicitly selected
        if: inputs.trusted_ref == 'bgrablin/release-packaging'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bgrablin/release-packaging
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checked-out source SHA
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.trusted_ref }}
          REQUESTED_SHA: ${{ inputs.trusted_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          test "$checked_out_sha" = "$REQUESTED_SHA"
          python scripts/ci/validate_live_source.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$REQUESTED_REF" \
            --source-sha "$REQUESTED_SHA" \
            --checkout "$GITHUB_WORKSPACE"
          printf 'trusted_ref=%s\n' "$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          printf 'trusted_sha=%s\n' "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  live-contract:
    name: Live Jev / protected environment / exact source
    needs: authorize-source
    if: needs.authorize-source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: jev-live
    steps:
      - name: Check out main when main was authorized
        if: needs.authorize-source.outputs.trusted_ref == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the stacked base when it was authorized
        if: needs.authorize-source.outputs.trusted_ref == 'bgrablin/release-packaging'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bgrablin/release-packaging
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact authorized source again
        shell: bash
        env:
          TRUSTED_REF: ${{ needs.authorize-source.outputs.trusted_ref }}
          TRUSTED_SHA: ${{ needs.authorize-source.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          test "$checked_out_sha" = "$TRUSTED_SHA"
          python scripts/ci/validate_live_source.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$TRUSTED_REF" \
            --source-sha "$TRUSTED_SHA" \
            --checkout "$GITHUB_WORKSPACE"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Fetch pinned Hermes source outside the candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$RUNNER_TEMP/hermes-agent"
          rm -rf "$hermes_root"
          mkdir -p "$hermes_root"
          git -C "$hermes_root" init --quiet
          git -C "$hermes_root" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_root" fetch --no-tags --depth=1 origin "$HERMES_UPSTREAM_SHA"
          git -C "$hermes_root" -c core.autocrlf=false checkout --quiet --detach "$HERMES_UPSTREAM_SHA"
          test "$(git -C "$hermes_root" rev-parse --verify HEAD)" = "$HERMES_UPSTREAM_SHA"

      - name: Install pinned Hermes with the upstream supported setup
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$RUNNER_TEMP/hermes-agent"
          hermes_venv="$RUNNER_TEMP/switchyard-hermes-venv"
          uv venv "$hermes_venv" --python 3.11
          UV_NO_CONFIG=1 uv pip install --python "$hermes_venv/bin/python" -e "$hermes_root[all,dev]"
          test "$(git -C "$hermes_root" rev-parse --verify HEAD)" = "$HERMES_UPSTREAM_SHA"
          printf 'HERMES_PYTHON=%s\n' "$hermes_venv/bin/python" >> "$GITHUB_ENV"
          printf 'HERMES_HOME=%s\n' "$RUNNER_TEMP/switchyard-hermes-home" >> "$GITHUB_ENV"
          printf '%s\n' "$hermes_venv/bin" >> "$GITHUB_PATH"

      - name: Validate candidate through Hermes Plugin Doctor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/switchyard-live-receipts"
          hermes plugins doctor --ci "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/switchyard-live-receipts/plugin-doctor.log"

      - name: Require the protected OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo '::error::OPENROUTER_API_KEY is absent from protected environment jev-live'
            exit 1
          fi
          echo 'Protected live-contract credential is present; value is not printed.'

      - name: Run authorized live Jev contract
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRUSTED_SHA: ${{ needs.authorize-source.outputs.trusted_sha }}
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" scripts/ci/live_jev_contract.py \
            --plugin-root "$GITHUB_WORKSPACE" \
            --upstream-root "$RUNNER_TEMP/hermes-agent" \
            --source-sha "$TRUSTED_SHA" \
            --upstream-sha "$HERMES_UPSTREAM_SHA" \
            --secret-home "$HERMES_HOME" \
            --report "$RUNNER_TEMP/switchyard-live-receipts/live-jev.json"

      - name: Write live contract summary
        if: always()
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.authorize-source.outputs.trusted_sha }}
          TRUSTED_REF: ${{ needs.authorize-source.outputs.trusted_ref }}
        run: |
          {
            echo "## Live Jev contract"
            echo "- Reviewed ref: $TRUSTED_REF"
            echo "- Candidate source SHA: $TRUSTED_SHA"
            echo "- Protected environment: jev-live"
            echo "- Provider fallback: disabled by the candidate Decisions client"
            echo "- Receipt: see the source-bound artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live Jev receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: switchyard-live-jev-${{ needs.authorize-source.outputs.trusted_sha }}
          path: ${{ runner.temp }}/switchyard-live-receipts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
          compression-level: 9
