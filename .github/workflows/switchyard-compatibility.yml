name: Switchyard compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchyard-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_UPSTREAM_SHA: 8503ee4459316ce092b5d69b7d396c27aa03d0be

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / native Hermes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          printf 'SWITCHYARD_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Fetch pinned Hermes source outside the candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$RUNNER_TEMP/hermes-agent"
          rm -rf "$hermes_root"
          mkdir -p "$hermes_root"
          git -C "$hermes_root" init --quiet
          git -C "$hermes_root" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_root" fetch --no-tags --depth=1 origin "$HERMES_UPSTREAM_SHA"
          git -C "$hermes_root" -c core.autocrlf=false checkout --quiet --detach "$HERMES_UPSTREAM_SHA"
          test "$(git -C "$hermes_root" rev-parse --verify HEAD)" = "$HERMES_UPSTREAM_SHA"

      - name: Install pinned Hermes with the upstream supported setup
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$RUNNER_TEMP/hermes-agent"
          hermes_venv="$RUNNER_TEMP/switchyard-hermes-venv"
          uv venv "$hermes_venv" --python "${{ matrix.python-version }}"
          if [ -x "$hermes_venv/bin/python" ]; then
            hermes_python="$hermes_venv/bin/python"
            hermes_bin="$hermes_venv/bin"
          else
            hermes_python="$hermes_venv/Scripts/python.exe"
            hermes_bin="$hermes_venv/Scripts"
          fi
          UV_NO_CONFIG=1 uv pip install --python "$hermes_python" -e "$hermes_root[all,dev]"
          test "$(git -C "$hermes_root" rev-parse --verify HEAD)" = "$HERMES_UPSTREAM_SHA"
          export PATH="$hermes_bin:$PATH"
          command -v hermes
          hermes --version
          printf 'HERMES_PYTHON=%s\n' "$hermes_python" >> "$GITHUB_ENV"
          printf 'HERMES_HOME=%s\n' "$RUNNER_TEMP/switchyard-hermes-home" >> "$GITHUB_ENV"
          printf '%s\n' "$hermes_bin" >> "$GITHUB_PATH"

      - name: Validate manifest through Hermes catalog checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/switchyard-receipts"
          hermes plugins validate --json "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/switchyard-receipts/manifest-validation.json"

      - name: Validate registration through Hermes Plugin Doctor
        shell: bash
        run: |
          set -euo pipefail
          hermes plugins doctor --ci "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/switchyard-receipts/plugin-doctor.log"

      - name: Check native loader, registration, and tool schemas
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" scripts/ci/check_native_hermes.py \
            --plugin-root "$GITHUB_WORKSPACE" \
            --upstream-root "$RUNNER_TEMP/hermes-agent" \
            --upstream-sha "$HERMES_UPSTREAM_SHA" \
            --source-sha "$SWITCHYARD_SOURCE_SHA" \
            --report "$RUNNER_TEMP/switchyard-receipts/native-compatibility.json"

      - name: Run offline plugin checks
        shell: bash
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY GH_TOKEN GITHUB_TOKEN GITHUB_PAT
          "$HERMES_PYTHON" -m compileall -q jev_decision evaluation tests scripts
          "$HERMES_PYTHON" scripts/check_portability.py
          "$HERMES_PYTHON" -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/switchyard-receipts/offline-tests.log"
          "$HERMES_PYTHON" evaluation/evaluate.py --validate --output "$RUNNER_TEMP/switchyard-receipts/synthetic-results.json"

      - name: Write compatibility summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Switchyard compatibility"
            echo "- Candidate source SHA: ${SWITCHYARD_SOURCE_SHA:-unavailable}"
            echo "- Hermes source SHA: $HERMES_UPSTREAM_SHA"
            echo "- Native manifest, registration, and tool-schema checks: see receipt artifact"
            echo "- Live Jev requests: not run by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: switchyard-compatibility-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/switchyard-receipts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
          compression-level: 9
