name: Switchyard compatibility

# CI cost/signal design:
# - Pull requests get one fast combo (ubuntu-latest / Python 3.11) as the required merge
#   gate. All 26 prior compatibility failures broke identically across every matrix cell,
#   so running the full 6-way matrix on every PR push bought redundant runs, not extra
#   signal, against a limited Actions minutes budget.
# - The full 2 OS x 3 Python matrix runs after code lands on main, plus a weekly
#   schedule and manual dispatch, to still catch real OS/version-specific drift without
#   paying the 6x multiplier on every PR iteration. Weekly and manual runs add one
#   non-required Ubuntu / Python 3.14 pre-qualification cell; it is outside the PR gate.
# - `compatibility` defines the step sequence exactly once. `plan` only decides how many
#   matrix cells that one sequence expands into for the current event, so a future
#   dependency/security/test-command change updates one lane, never two that can drift
#   apart. tests/test_ci_contracts.py pins this event -> matrix-size behavior.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly Monday 06:17 UTC full-matrix regression check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchyard-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_UPSTREAM_SHA: 8503ee4459316ce092b5d69b7d396c27aa03d0be

jobs:
  plan:
    name: Plan compatibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute event-dependent matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            matrix='{"include":[{"os":"ubuntu-latest","python-version":"3.11"}]}'
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix='{"include":[
              {"os":"ubuntu-latest","python-version":"3.11"},
              {"os":"ubuntu-latest","python-version":"3.12"},
              {"os":"ubuntu-latest","python-version":"3.13"},
              {"os":"windows-latest","python-version":"3.11"},
              {"os":"windows-latest","python-version":"3.12"},
              {"os":"windows-latest","python-version":"3.13"},
              {"os":"ubuntu-latest","python-version":"3.14"}
            ]}'
          else
            matrix='{"include":[
              {"os":"ubuntu-latest","python-version":"3.11"},
              {"os":"ubuntu-latest","python-version":"3.12"},
              {"os":"ubuntu-latest","python-version":"3.13"},
              {"os":"windows-latest","python-version":"3.11"},
              {"os":"windows-latest","python-version":"3.12"},
              {"os":"windows-latest","python-version":"3.13"}
            ]}'
          fi
          compact="$(printf '%s' "$matrix" | tr -d '\n ')"
          printf 'matrix=%s\n' "$compact" >> "$GITHUB_OUTPUT"

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / native Hermes
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          printf 'SWITCHYARD_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Fetch pinned Hermes source outside the candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$RUNNER_TEMP/hermes-agent"
          rm -rf "$hermes_root"
          mkdir -p "$hermes_root"
          git -C "$hermes_root" init --quiet
          git -C "$hermes_root" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$hermes_root" fetch --no-tags --depth=1 origin "$HERMES_UPSTREAM_SHA"
          git -C "$hermes_root" -c core.autocrlf=false checkout --quiet --detach "$HERMES_UPSTREAM_SHA"
          test "$(git -C "$hermes_root" rev-parse --verify HEAD)" = "$HERMES_UPSTREAM_SHA"

      - name: Install pinned Hermes with the upstream supported setup
        shell: bash
        run: |
          set -euo pipefail
          hermes_root="$RUNNER_TEMP/hermes-agent"
          hermes_venv="$RUNNER_TEMP/switchyard-hermes-venv"
          uv venv "$hermes_venv" --python "${{ matrix.python-version }}"
          if [ -x "$hermes_venv/bin/python" ]; then
            hermes_python="$hermes_venv/bin/python"
            hermes_bin="$hermes_venv/bin"
          else
            hermes_python="$hermes_venv/Scripts/python.exe"
            hermes_bin="$hermes_venv/Scripts"
          fi
          UV_NO_CONFIG=1 uv pip install --python "$hermes_python" -e "$hermes_root[all,dev]"
          test "$(git -C "$hermes_root" rev-parse --verify HEAD)" = "$HERMES_UPSTREAM_SHA"
          export PATH="$hermes_bin:$PATH"
          command -v hermes
          hermes --version
          printf 'HERMES_PYTHON=%s\n' "$hermes_python" >> "$GITHUB_ENV"
          printf 'HERMES_HOME=%s\n' "$RUNNER_TEMP/switchyard-hermes-home" >> "$GITHUB_ENV"
          printf '%s\n' "$hermes_bin" >> "$GITHUB_PATH"

      - name: Validate manifest through Hermes catalog checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/switchyard-receipts"
          hermes plugins validate --json "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/switchyard-receipts/manifest-validation.json"

      - name: Validate registration through Hermes Plugin Doctor
        shell: bash
        run: |
          set -euo pipefail
          hermes plugins doctor --ci "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/switchyard-receipts/plugin-doctor.log"

      - name: Check native loader, registration, and tool schemas
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" scripts/ci/check_native_hermes.py \
            --plugin-root "$GITHUB_WORKSPACE" \
            --upstream-root "$RUNNER_TEMP/hermes-agent" \
            --upstream-sha "$HERMES_UPSTREAM_SHA" \
            --source-sha "$SWITCHYARD_SOURCE_SHA" \
            --report "$RUNNER_TEMP/switchyard-receipts/native-compatibility.json"

      - name: Call every registered tool through Hermes' real dispatch
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" scripts/ci/check_native_tool_invocation.py \
            --plugin-root "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/switchyard-receipts/native-tool-invocation.json"

      - name: Run Ruff lint gate
        shell: bash
        run: |
          set -euo pipefail
          UV_NO_CONFIG=1 uvx --from ruff==0.11.13 ruff check .

      - name: Run offline plugin checks
        shell: bash
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY GH_TOKEN GITHUB_TOKEN GITHUB_PAT
          "$HERMES_PYTHON" -m compileall -q hermes_switchyard evaluation tests scripts
          "$HERMES_PYTHON" scripts/check_portability.py
          "$HERMES_PYTHON" -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/switchyard-receipts/offline-tests.log"
          "$HERMES_PYTHON" evaluation/evaluate.py --validate --output "$RUNNER_TEMP/switchyard-receipts/synthetic-results.json"

      - name: Write compatibility summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Switchyard compatibility"
            echo "- Candidate source SHA: ${SWITCHYARD_SOURCE_SHA:-unavailable}"
            echo "- Hermes source SHA: $HERMES_UPSTREAM_SHA"
            echo "- Combo: ${{ matrix.os }} / Python ${{ matrix.python-version }}"
            echo "- Native manifest, registration, and tool-schema checks: see receipt artifact"
            echo "- Live Jev requests: not run by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: switchyard-compatibility-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/switchyard-receipts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
          compression-level: 9
